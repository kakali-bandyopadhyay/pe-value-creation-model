[project]
name = "pe-value-creation-model"
version = "0.1.0"
description = "Synthetic Excel value-creation and sponsor returns model"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
